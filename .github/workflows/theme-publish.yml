name: Theme Validation & Publishing

on:
  push:
    branches: [main, develop]
    paths:
      - "src/theme/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/theme-publish.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "src/theme/**"
      - "scripts/**"
      - "package.json"
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation to run"
        required: true
        default: publish
        type: choice
        options:
          - publish
          - rollback
      rollbackVersion:
        description: "Published version to re-tag as stable"
        required: false
        type: string

env:
  REGISTRY_URL: ${{ secrets.VERDACCIO_URL || 'http://localhost:4873' }}
  VERDACCIO_TOKEN: ${{ secrets.VERDACCIO_TOKEN }}
  THEME_PACKAGE_NAME: ${{ vars.THEME_PACKAGE_NAME || '@ctms/theme' }}
  CDN_UPLOAD_URL: ${{ secrets.CDN_UPLOAD_URL }}
  CDN_UPLOAD_KEY: ${{ secrets.CDN_UPLOAD_KEY }}
  NODE_VERSION: "20"

jobs:
  validate:
    name: Validate Theme Accessibility
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'publish'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run accessibility checks
        run: yarn theme:validate
        continue-on-error: false

      - name: Build theme bundle
        run: yarn theme:build-bundle

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wcag-validation-report
          path: dist/theme/validation-report.json

      - name: Check bundle size
        run: yarn theme:check-size
        continue-on-error: false

  lint:
    name: Lint Theme Code
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'publish'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run ESLint
        run: yarn lint

      - name: Run Prettier
        run: yarn format:check

  build:
    name: Build Theme Bundle
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'publish'
    needs: [validate, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build application
        run: yarn build

      - name: Build theme bundle
        run: yarn theme:build-bundle

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: theme-bundle
          path: dist/theme/all-themes*.js
          retention-days: 30

  publish:
    name: Publish to Verdaccio
    if: (github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'workflow_dispatch' && inputs.operation == 'publish')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Configure npm registry
        run: |
          yarn npm config set registry "${REGISTRY_URL}"
          REGISTRY_HOST="${REGISTRY_URL#http://}"
          REGISTRY_HOST="${REGISTRY_HOST#https://}"
          yarn npm config set "//${REGISTRY_HOST}/:_authToken" "${VERDACCIO_TOKEN}"
        env:
          REGISTRY_URL: ${{ env.REGISTRY_URL }}
          VERDACCIO_TOKEN: ${{ env.VERDACCIO_TOKEN }}

      - name: Publish to Verdaccio
        run: yarn npm publish
        continue-on-error: false

      - name: Tag published version as stable
        run: |
          VERSION=$(node -p "require('./package.json').version")
          yarn npm dist-tag add ${THEME_PACKAGE_NAME}@${VERSION} stable

      - name: Generate bundle from published package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          yarn theme:build-from-registry -- --package "${THEME_PACKAGE_NAME}" --version "${VERSION}" --registry "${REGISTRY_URL}"

      - name: Upload to CDN
        run: |
          VERSION=$(node -p "require('./package.json').version")
          yarn theme:upload -- --version "${VERSION}"
        env:
          CDN_UPLOAD_URL: ${{ env.CDN_UPLOAD_URL }}
          CDN_UPLOAD_KEY: ${{ env.CDN_UPLOAD_KEY }}

      - name: Post deployment summary
        if: success()
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "## Theme Bundle Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry**: Verdaccio" >> $GITHUB_STEP_SUMMARY
          echo "- **CDN URL**: /themes/stable/all-themes.js" >> $GITHUB_STEP_SUMMARY
          echo "- **Versioned URL**: /themes/$VERSION/all-themes.js" >> $GITHUB_STEP_SUMMARY

  rollback:
    name: Rollback Theme Version
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Configure npm registry
        run: |
          yarn npm config set registry "${REGISTRY_URL}"
          REGISTRY_HOST="${REGISTRY_URL#http://}"
          REGISTRY_HOST="${REGISTRY_HOST#https://}"
          yarn npm config set "//${REGISTRY_HOST}/:_authToken" "${VERDACCIO_TOKEN}"
        env:
          REGISTRY_URL: ${{ env.REGISTRY_URL }}
          VERDACCIO_TOKEN: ${{ env.VERDACCIO_TOKEN }}

      - name: Restore stable tag
        run: |
          if [ -z "${{ inputs.rollbackVersion }}" ]; then
            echo "rollbackVersion input is required for rollback operation"
            exit 1
          fi
          yarn npm dist-tag add ${THEME_PACKAGE_NAME}@${{ inputs.rollbackVersion }} stable
        continue-on-error: false

      - name: Rebuild rollback bundle from published package
        run: |
          yarn install --immutable
          yarn theme:build-from-registry -- --package "${THEME_PACKAGE_NAME}" --version "${{ inputs.rollbackVersion }}" --registry "${REGISTRY_URL}"

      - name: Upload rollback bundle to CDN
        run: |
          yarn theme:upload -- --version "${{ inputs.rollbackVersion }}"
        env:
          CDN_UPLOAD_URL: ${{ env.CDN_UPLOAD_URL }}
          CDN_UPLOAD_KEY: ${{ env.CDN_UPLOAD_KEY }}

      - name: Notification
        run: |
          echo "Manual rollback completed. Stable now points to v${{ inputs.rollbackVersion }}"
