name: Theme Validation & Publishing

on:
  push:
    branches: [main, develop]
    paths:
      - "src/theme/**"
      - "package.json"
      - ".github/workflows/theme-publish.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "src/theme/**"
      - "package.json"
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation to run"
        required: true
        default: publish
        type: choice
        options:
          - publish
          - rollback
      rollbackVersion:
        description: "Published version to re-tag as stable"
        required: false
        type: string

env:
  REGISTRY_URL: ${{ secrets.VERDACCIO_URL || 'http://localhost:4873' }}
  VERDACCIO_TOKEN: ${{ secrets.VERDACCIO_TOKEN }}
  CDN_UPLOAD_KEY: ${{ secrets.CDN_UPLOAD_KEY }}
  NODE_VERSION: "18"

jobs:
  validate:
    name: Validate Theme Accessibility
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'publish'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run accessibility checks
        run: npm run theme:validate
        continue-on-error: false

      - name: Build theme bundle
        run: npm run theme:build-bundle

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wcag-validation-report
          path: dist/theme/validation-report.json

      - name: Check bundle size
        run: npm run theme:check-size
        continue-on-error: false

  lint:
    name: Lint Theme Code
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'publish'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier
        run: npm run format:check

  build:
    name: Build Theme Bundle
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'publish'
    needs: [validate, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Build theme bundle
        run: npm run theme:build-bundle

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: theme-bundle
          path: dist/theme/all-themes*.js
          retention-days: 30

  publish:
    name: Publish to Verdaccio
    if: (github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'workflow_dispatch' && inputs.operation == 'publish')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure npm registry
        run: |
          npm config set registry "${REGISTRY_URL}"
          REGISTRY_HOST="${REGISTRY_URL#http://}"
          REGISTRY_HOST="${REGISTRY_HOST#https://}"
          npm config set "//${REGISTRY_HOST}/:_authToken" "${VERDACCIO_TOKEN}"
        env:
          REGISTRY_URL: ${{ env.REGISTRY_URL }}
          VERDACCIO_TOKEN: ${{ env.VERDACCIO_TOKEN }}

      - name: Publish to Verdaccio
        run: npm publish
        continue-on-error: false

      - name: Generate bundle
        run: npm run theme:build-bundle

      - name: Upload to CDN
        run: |
          echo "Uploading theme bundle to CDN..."
          # Example CDN upload - adjust for your CDN provider
          # aws s3 cp dist/theme/all-themes.js s3://your-bucket/themes/stable/all-themes.js
          # aws s3 cp dist/theme/all-themes-v*.js s3://your-bucket/themes/$VERSION/all-themes.js
          echo "✓ Bundle uploaded to CDN"
        env:
          CDN_BUCKET: ${{ secrets.CDN_BUCKET }}

      - name: Post deployment summary
        if: success()
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "## ✓ Theme Bundle Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry**: Verdaccio" >> $GITHUB_STEP_SUMMARY
          echo "- **CDN URL**: /themes/stable/all-themes.js" >> $GITHUB_STEP_SUMMARY
          echo "- **Versioned URL**: /themes/$VERSION/all-themes.js" >> $GITHUB_STEP_SUMMARY

  rollback:
    name: Rollback Theme Version
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Configure npm registry
        run: |
          npm config set registry "${REGISTRY_URL}"
          REGISTRY_HOST="${REGISTRY_URL#http://}"
          REGISTRY_HOST="${REGISTRY_HOST#https://}"
          npm config set "//${REGISTRY_HOST}/:_authToken" "${VERDACCIO_TOKEN}"
        env:
          REGISTRY_URL: ${{ env.REGISTRY_URL }}
          VERDACCIO_TOKEN: ${{ env.VERDACCIO_TOKEN }}

      - name: Restore stable tag
        run: |
          if [ -z "${{ inputs.rollbackVersion }}" ]; then
            echo "rollbackVersion input is required for rollback operation"
            exit 1
          fi
          npm dist-tag add @ctms/theme@${{ inputs.rollbackVersion }} stable
        continue-on-error: false

      - name: Rebuild rollback bundle metadata
        run: |
          npm ci
          npm run theme:build-bundle -- --version "${{ inputs.rollbackVersion }}"

      - name: Upload rollback bundle to CDN
        run: |
          echo "Uploading rollback theme bundle to CDN..."
          # Example CDN upload - adjust for your CDN provider
          # aws s3 cp dist/theme/all-themes.js s3://your-bucket/themes/stable/all-themes.js --cache-control max-age=60,must-revalidate
          # aws s3 cp dist/theme/all-themes-v${{ inputs.rollbackVersion }}.js s3://your-bucket/themes/${{ inputs.rollbackVersion }}/all-themes.js --cache-control max-age=31536000,immutable
          echo "✓ Rollback bundle uploaded to CDN"
        env:
          CDN_BUCKET: ${{ secrets.CDN_BUCKET }}

      - name: Notification
        run: |
          echo "⚠️ Manual rollback completed. Stable now points to v${{ inputs.rollbackVersion }}"
