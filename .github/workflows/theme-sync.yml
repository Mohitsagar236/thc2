name: Sync Theme to Micro Frontends

on:
  push:
    branches:
      - develop
    paths:
      - 'src/theme/**'
      - 'tailwind.config.js'
      - 'package.json'

jobs:
  build-theme:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Get theme version
        id: version
        run: echo "version=$(node -p \"require('./package.json').version\")" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint & Format Check
        run: yarn lint && yarn format:check

      - name: Validate themes
        run: yarn theme:validate

      - name: Build theme bundle
        run: yarn theme:build-bundle

      - name: Check bundle size
        run: yarn theme:check-size

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: theme-bundle
          path: dist/
          retention-days: 1

  sync-mfes:
    needs: build-theme
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run cross-repo theme sync
        env:
          MFE_SYNC_TOKEN: ${{ secrets.MFE_SYNC_TOKEN }}
        run: yarn sync:mfes

  notify:
    needs: [build-theme, sync-mfes]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Post sync status
        run: |
          echo "🎨 Theme Sync Status"
          echo "=================="
          echo "Version: ${{ needs.build-theme.outputs.version }}"
          echo "Build Status: ${{ needs.build-theme.result }}"
          echo "Sync Status: ${{ needs.sync-mfes.result }}"
          echo "Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Send Webhook Notification
        if: vars.SYNC_WEBHOOK_URL != ''
        run: |
          curl -X POST "${{ vars.SYNC_WEBHOOK_URL }}" \
            -H 'Content-Type: application/json' \
            -d '{
              "event": "theme-sync-complete",
              "status": "${{ needs.sync-mfes.result }}",
              "version": "${{ needs.build-theme.outputs.version }}",
              "timestamp": "'$(date -u +'%Y-%m-%dT%H:%M:%SZ')'",
              "commit": "${{ github.sha }}",
              "actor": "${{ github.actor }}"
            }' || echo "⚠️  Webhook notification failed (optional)"

      - name: Print summary
        run: |
          echo "### 🎨 Theme Sync Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.build-theme.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Build Result:** ${{ needs.build-theme.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Sync Result:** ${{ needs.sync-mfes.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Synced At:** $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**MFEs Updated:**" >> $GITHUB_STEP_SUMMARY
          echo "- mfe-dashboard" >> $GITHUB_STEP_SUMMARY
          echo "- mfe-admin" >> $GITHUB_STEP_SUMMARY
          echo "- mfe-user-profile" >> $GITHUB_STEP_SUMMARY
